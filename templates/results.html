<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="csrf_token" content="{{ csrf_token }}">
    <script src="../static/app.js"></script>
    <title>COMET</title>
</head>
<body>
    <!-- Header -->
    <div>
        <h1>COmprehensive Motif Evaluation Toolkit</h1>
    </div>
    <div>
        <!-- Header Buttons -->
        <div class="container-header">
            <div class="button-group">
                <button class="buttonHeader" onclick="pageProcessDNA()">Process DNA</button>
                <button class="buttonHeader" onclick="pageFilterAA()">Filter AA</button>
                <button class="buttonHeader" onclick="pageFilterMotif()">Filter Motif</button>
                <button class="buttonHeader" onclick="pageCombineProfiles()">Combine Profiles</button>
                <button class="buttonHeader" onclick="pagePredictions()">Predict Activity</button>
            </div>
            <div class="button-group-r">
                <button class="buttonHeader" onclick="pageHome()">Home</button>
            </div>
        </div>
    </div>


    <!-- Application -->
    <div class="box">
        <h2>Results</h2>
        <div class="box-form">
            <div class="input-form">
                <div>
                    <p class="pL">Job Details:</p>
                    {% for key, value in parameters.items() %}
                        <p class="p3">
                            * {{ key }}: <span class="param-value">{{ value }}</span>
                        </p>
                    {% endfor %}
                </div>
                <div class="box-button"> <!-- ← new box -->
                    <div id="button-container"></div>
                </div>
            </div>
        </div>
        <div id="figures-container" class="figures-container"></div>

        <script>
            const parameters = JSON.parse('{{ parameters | tojson | escape }}');
            document.addEventListener('DOMContentLoaded', () => {
                if (parameters['Invalid File']) {
                    console.log("Invalid file detected!");
                    window.location.href = '/error';
                }

                // Get timer,
                let pollInterval;
                if (
                    parameters.hasOwnProperty('Unique Experimental Substrates') ||
                    parameters.hasOwnProperty('Unique Background Substrates')
                ) {
                    pollInterval = 1000;
                } else if (parameters['Job'] === 'Process DNA') {
                    pollInterval = 180000;
                    // pollInterval = 1000; // ##
                } else {
                    pollInterval = 1000; // Default to 1 second
                }
                getFigures(true, pollInterval);
            });
        </script>
    </div>
    <div class=ft>
        <span>Version 1.0.0 (2026)</span>
        <a href="https://brent.iverson.cm.utexas.edu/">
            <button class="btn">Iverson Lab</button>
        </a>
    </div>
</body>
</html>
