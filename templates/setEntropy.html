<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="csrf_token" content="{{ csrf_token() }}">
    <script src="../static/app.js"></script>
    <title>COMET</title>
</head>
<body>
    <!-- Header -->
    <div>
        <h1>COmprehensive Motif Evaluation Toolkit</h1>
    </div>
    <div>
        <!-- Header Buttons -->
        <div class="container-header">
            <div class="button-group">
                <button class="buttonHeader" onclick="pageProcessDNA()">Process DNA</button>
                <button class="buttonHeader" onclick="pageFilterAA()">Filter AA</button>
                <button class="buttonHeader" onclick="pageFilterMotif()">Filter Motif</button>
                <button class="buttonHeader" onclick="pageCombineProfiles()">Combine Profiles</button>
                <button class="buttonHeader" onclick="pagePredictions()">Predict Activity</button>
            </div>
            <div class="button-group-r">
                <button class="buttonHeader" onclick="pageHome()">Home</button>
            </div>
        </div>
    </div>

    <!-- Application -->
    <div class="box">
        <h2>Filter Motif</h2>

        <!-- Forms -->
        <div class="box-form">
            <form id="filterSubs" enctype="multipart/form-data" class="input-form" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Minimum ES: Filter -->
                <div class="form-group">
                    <div class="help">
                        <label for="minES">Minimum ES: Motif ID</label>
                        <div class="help-icon">?
                            <span class="help-tooltip">
                                Minimum ES of a favorable AA when identifying the initial Motif Filter.
                            </span>
                        </div>
                    </div>
                    <div class="form-wrapper">
                        <input type="number" id="minES" name="minES"
                               value="{{ minES }}" step="0.01" style="width: 70px;"
                               required>
                    </div>
                </div>

                <!-- Minimum ES: Refine Filter -->
                <div class="form-group">
                    <div class="help">
                        <label for="minESRel">Minimum ES: Refine Filter</label>
                        <div class="help-icon">?
                            <span class="help-tooltip">
                                Minimum ES of a favorable AA when refining the Motif Filter.
                            </span>
                        </div>
                    </div>
                    <div class="form-wrapper">
                        <input type="number" id="minESRel" name="minESRel"
                               value="{{ minESRel }}" step="0.01" style="width: 70px;"
                               required>
                    </div>
                </div>

                <!-- Entropy -->
                <div class="form-group">
                    <div class="help">
                        <label for="minS">Minimum ∆S</label>
                        <div class="help-icon">?
                            <span class="help-tooltip">
                                Minimum entropy score for identifying the recognition site.
                            </span>
                        </div>
                    </div>
                    <div class="form-wrapper">
                        <input type="number" id="minS" name="minS"
                               value="{{ minS }}" min="0" max="4.32" step="0.01"
                               style="width: 70px;" onchange="updateMinS()"
                               required>
                    </div>
                </div>

                <div class="form-group" id="motifPosContainer">
                    <label for="motifPosDefault">Motif Positions:</label>
                    <p class="p3" id="motifPosDefault">Evaluating Entropy</p>
                </div>

                <!-- Execute -->
                <div class="button-wrapper" id="button-container">
<!--                        <button class="button" onclick="buttonFilterSubs('comet')">Filter</button>-->
                </div>
            </form>
        </div>
        <!-- Container where JS will insert images -->
        <div id="figures-container" class="figures-container"></div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                getFiguresEntropy();
            });
        </script>
    </div>
    <div class=ft>
        <span>Version 1.0.0 (2026)</span>
        <a href="https://brent.iverson.cm.utexas.edu/">
            <button class="btn">Iverson Lab</button>
        </a>
    </div>
</body>
</html>
